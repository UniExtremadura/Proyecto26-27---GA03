{% extends "base.html" %}
{% block title %}Iniciar sesión · Campus UNEX{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<p>Usuarios de demostración: <code>alumno1</code>, <code>profesor1</code>, <code>pas1</code> (contraseña <code>demo1234</code>).</p>
<form method="post">

</form>
{% endblock %}
