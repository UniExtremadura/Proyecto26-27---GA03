{% extends "movil/base_movil.html" %}
{% block title %}Entrar · Campus UNEX móvil{% endblock %}
{% block content %}
<h2>Iniciar sesión</h2>
<form id="form-login">
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" autocomplete="username" required>
  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required>
  <p id="error" role="alert"></p>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/movil-login.js') }}" defer></script>{% endblock %}
