<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5c3b">
  <title>{% block title %}Campus UNEX móvil{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/movil.css') }}">
</head>
<body>
  <header class="barra"><h1>Campus UNEX</h1></header>
  <main id="contenido">{% block content %}{% endblock %}</main>
  <nav class="pestanas" aria-label="Navegación móvil">
    <a href="{{ url_for('movil.inicio') }}">Inicio</a>
  </nav>
  {% block scripts %}{% endblock %}
</body>
</html>
